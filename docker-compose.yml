# مونگوی محلی توسعه — فقط ابزار توسعه است، نه استقرار.
#
# چرا اصلاً یک مونگوی محلی: قدم‌های ۳ تا ۸ (استنتاج schema، گارد امنیتی،
# ایجنت، گراف) باید روی داده‌ی واقعی تست شوند. وابسته‌کردن توسعه به سرور
# مشتری یعنی هیچ تستی قابل تکرار نیست و هر توسعه‌دهنده‌ای نتیجه‌ی متفاوتی
# می‌گیرد.

services:
  mongo:
    # نسخه‌ی major پین شده تا رفتار aggregation بین سیستم‌ها یکسان بماند؛
    # گارد قدم ۴ روی فهرست اپراتورهای همین نسخه بسته می‌شود.
    image: mongo:8
    container_name: rasam-mongo
    restart: unless-stopped
    ports:
      # چرا 127.0.0.1: بدون این، داکر پورت را روی همه‌ی رابط‌های شبکه باز
      # می‌کند و از فایروال ویندوز هم رد می‌شود — یعنی مونگوی توسعه روی کل
      # شبکه‌ی محلی قابل دسترس می‌شود. اینجا داده‌ی مشتری هست.
      - "127.0.0.1:27017:27017"
    environment:
      # فقط *نام* متغیرها اینجاست؛ مقدارشان در `.env` که کامیت نمی‌شود.
      # علامت `:?` یعنی اگر تعریف نشده باشند، compose با خطای واضح می‌ایستد
      # به‌جای اینکه مونگویی بدون احراز هویت بالا بیاورد.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?در .env تعریف نشده}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?در .env تعریف نشده}
    volumes:
      # چرا volume نام‌دار و نه bind mount به پوشه‌ی پروژه: مونگو روی
      # فایل‌سیستم ویندوز (از طریق bind mount) به‌خاطر قفل‌گذاری فایل‌ها
      # ناپایدار است. volume داخلی داکر این مشکل را ندارد.
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
